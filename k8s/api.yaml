apiVersion: v1
kind: Service
metadata:
  name: jira-api
  namespace: jira-poc
spec:
  type: NodePort
  selector:
    app: jira-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-api
  namespace: jira-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jira-api
  template:
    metadata:
      labels:
        app: jira-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: jira-poc-nuam:local
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: jira-decision-credentials
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jira-poc-secrets
                  key: DATABASE_URL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jira-poc-secrets
                  key: API_TOKEN
            - name: DECISION_PROVIDER
              value: mock
            - name: PROVIDER_FAILURE
              value: none
            - name: DECISION_THRESHOLD
              value: "0.90"
            - name: DECISION_MIN_MARGIN
              value: "0.08"
            - name: DECISION_MAX_REQUEST_BYTES
              value: "24000"
            - name: DECISION_SERVICE_CANDIDATES
              value: "2"
            - name: DECISION_TIMEOUT_SECONDS
              value: "15"
            - name: CLASSIFICATION_TIMEOUT_SECONDS
              value: "60"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
